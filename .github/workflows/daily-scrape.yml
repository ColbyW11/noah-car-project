name: Daily scrape

# Runs the full pipeline unattended on GitHub Actions:
#   1. Scrape every active dealer (scripts/ci_run.py).
#   2. Push raw + processed outputs to the separate `vw-scraper-data` repo.
#   3. Slack-alert on run-level exceptions or degraded runs (>25% dealer
#      failures) — handled inside ci_run.py.
#
# Required GitHub Actions secrets:
#   - VW_SCRAPER_SLACK_WEBHOOK: incoming-webhook URL for the alerts channel
#   - VW_SCRAPER_DATA_TOKEN:    fine-grained PAT with contents:write on
#                               the ColbyW11/vw-scraper-data repo
#
# Drive sync is now opt-in: ci_run.py skips it when env vars are unset.
# To re-enable Drive (in addition to or instead of the data-repo push),
# set VW_SCRAPER_DRIVE_FOLDER_ID + GCP_SERVICE_ACCOUNT_JSON and re-add
# the "Write service account JSON" + Drive-env-var steps from git history.

on:
  schedule:
    - cron: "0 13 * * *"  # 13:00 UTC ≈ 9 AM ET (8 AM ET during DST shift)
  workflow_dispatch: {}

concurrency:
  group: daily-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VW_SCRAPER_SLACK_WEBHOOK: ${{ secrets.VW_SCRAPER_SLACK_WEBHOOK }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (pinned Python)
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run daily pipeline
        id: pipeline
        # ci_run.py: scrape + threshold check + Slack alert. Drive sync is
        # skipped because VW_SCRAPER_SA_PATH / VW_SCRAPER_DRIVE_FOLDER_ID
        # are not set in env — the next step handles persistence instead.
        run: uv run python scripts/ci_run.py

      - name: Push outputs to data repo
        # Pushes ./data/raw/<today>/ and ./data/processed/timeseries.parquet
        # to ColbyW11/vw-scraper-data, then commits and pushes. The data
        # repo is private — only the daily run and Colby's laptop have
        # write access (via the PAT).
        #
        # Always runs (even if the pipeline step partially failed) so we
        # don't lose data that did get scraped. Adjust to `if: success()`
        # if you'd rather keep the data repo clean of partial runs.
        if: always() && steps.pipeline.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ secrets.VW_SCRAPER_DATA_TOKEN }}
          # Data repo URL (no protocol — we'll inject the token). Override
          # via repo variable VW_SCRAPER_DATA_REPO if you rename it later.
          DATA_REPO: ${{ vars.VW_SCRAPER_DATA_REPO || 'ColbyW11/vw-scraper-data' }}
        run: |
          set -euo pipefail
          if [ ! -d data/raw ] && [ ! -f data/processed/timeseries.parquet ]; then
            echo "No data produced by this run; skipping push."
            exit 0
          fi
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${DATA_REPO}.git" \
            /tmp/data-repo
          mkdir -p /tmp/data-repo/raw /tmp/data-repo/processed
          # rsync rather than cp -r so we don't duplicate the data/ dir layer.
          if [ -d data/raw ]; then
            rsync -a data/raw/ /tmp/data-repo/raw/
          fi
          if [ -f data/processed/timeseries.parquet ]; then
            cp data/processed/timeseries.parquet /tmp/data-repo/processed/
          fi
          cd /tmp/data-repo
          git config user.name "vw-scraper-bot"
          git config user.email "noreply@github.com"
          git add raw processed
          if git diff --staged --quiet; then
            echo "No data changes to push."
          else
            git commit -m "Daily scrape $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Alert on infrastructure failure
        # ci_run.py self-alerts on its own exceptions, so this only catches
        # the case where the workflow exploded before reaching the pipeline
        # step (setup-uv, uv sync, playwright install) OR the push step
        # failed. We send the Slack alert from the runner directly.
        if: failure() && steps.pipeline.outcome != 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python - <<'PY'
          import os
          from vw_scraper.alerts import send_slack_alert
          send_slack_alert(
              f"Daily scrape workflow failed in setup or push step: {os.environ['RUN_URL']}",
              severity="error",
          )
          PY
